services:
  - type: web
    name: nfpl-access-control
    runtime: python
    buildCommand: pip install -r requirements.txt && python run.py seed
    startCommand: uvicorn src.api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
    autoDeploy: true
